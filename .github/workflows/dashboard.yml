name: Update Dashboard

on:
  schedule:
    - cron: '0 18 * * 1-5'  # Weekdays at 18:00 UTC (after London gold fix)
  workflow_dispatch:          # Manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance matplotlib numpy pandas

      - name: Run dashboard update
        run: python update_dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html dashboard_ratio.png dashboard_cusum.png data/
          git diff --staged --quiet || git commit -m "Update dashboard $(date -u +%Y-%m-%d)"
          git push
